name: Synthetic CPU tests

on:
  push:
    branches: [synthetic_data]
  pull_request:
    branches: [synthetic_data]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt duckdb==2.0.0
      - run: python eval/check_setup.py
      - run: python -m pytest -q -rs
